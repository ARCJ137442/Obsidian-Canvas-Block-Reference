name: Release Obsidian plugin

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  PLUGIN_NAME: obsidian-whiteboard-deduction-arc

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        shell: bash
        run: |
          mkdir "${PLUGIN_NAME}"
          cp main.js manifest.json styles.css "${PLUGIN_NAME}/"
          zip -r "${PLUGIN_NAME}-${{ github.event.release.tag_name }}.zip" "${PLUGIN_NAME}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "${PLUGIN_NAME}-${{ github.event.release.tag_name }}.zip"
          main.js manifest.json styles.css
          --clobber
